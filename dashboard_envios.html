<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Envío Masivo | Nodo Biocéanico 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #004aad;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 13px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }

        .card-enviados .card-value { color: #10b981; }
        .card-errores .card-value { color: #ef4444; }
        .card-total .card-value { color: #3b82f6; }

        .progress-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .progress-bar-container {
            width: 100%;
            height: 40px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .estado-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .estado-iniciando { background: #fbbf24; color: #78350f; }
        .estado-enviando { background: #3b82f6; color: white; }
        .estado-completado { background: #10b981; color: white; }

        .logs-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logs-container {
            max-height: 400px;
            overflow-y: auto;
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .log-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            background: white;
            border-left: 4px solid #10b981;
            animation: slideIn 0.3s ease;
        }

        .log-item.error {
            border-left-color: #ef4444;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-timestamp {
            color: #6b7280;
            font-weight: 600;
            font-size: 12px;
            min-width: 70px;
        }

        .log-email {
            color: #004aad;
            font-weight: 500;
            flex: 1;
        }

        .log-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .log-status.error {
            background: #ef4444;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #004aad;
            color: white;
        }

        .btn-primary:hover {
            background: #003a8c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,74,173,0.3);
        }

        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .ultimo-envio {
            margin-top: 15px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 8px;
            color: #1e40af;
            font-size: 14px;
            text-align: center;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #004aad;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .errores-detalle {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: none;
        }

        .errores-detalle.visible {
            display: block;
        }

        .error-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 6px;
            font-size: 13px;
        }

        .error-item strong {
            color: #991b1b;
        }

        /* Scrollbar personalizado */
        .logs-container::-webkit-scrollbar {
            width: 8px;
        }

        .logs-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .logs-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .logs-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📧 Dashboard de Envío Masivo</h1>
            <p>Nodo Biocéanico 2025 - Sistema de Reenvío de QR</p>
        </div>

        <!-- Tarjetas de Métricas -->
        <div class="dashboard">
            <div class="card card-enviados">
                <div class="card-title">✅ Enviados</div>
                <div class="card-value" id="enviados">0</div>
            </div>

            <div class="card card-errores">
                <div class="card-title">❌ Errores</div>
                <div class="card-value" id="errores">0</div>
            </div>

            <div class="card card-total">
                <div class="card-title">📊 Total</div>
                <div class="card-value" id="total">0</div>
            </div>
        </div>

        <!-- Barra de Progreso -->
        <div class="progress-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="color: #333;">Estado del Proceso</h3>
                <span class="estado-badge estado-iniciando" id="estado-badge">Esperando...</span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 0%;">
                    0%
                </div>
            </div>

            <div class="ultimo-envio" id="ultimo-envio">
                Esperando inicio del proceso...
            </div>

            <!-- Botones de Control -->
            <div class="control-buttons">
                <button class="btn btn-primary" id="btn-iniciar" onclick="iniciarEnvio()">
                    🚀 Iniciar Envío
                </button>
                <button class="btn btn-secondary" onclick="resetearSistema()" style="background:#ef4444;">
                    🔄 Resetear Sistema
                </button>
                <button class="btn btn-secondary" onclick="detenerMonitoreo()">
                    ⏸️ Detener Monitoreo
                </button>
            </div>
        </div>

        <!-- Logs en Tiempo Real -->
        <div class="logs-section">
            <h3 style="color: #333; margin-bottom: 10px;">📝 Log de Envíos en Tiempo Real</h3>
            <div class="logs-container" id="logs-container">
                <p style="text-align: center; color: #9ca3af; padding: 40px 0;">
                    No hay envíos aún. Presiona "Iniciar Envío" para comenzar.
                </p>
            </div>
        </div>

        <!-- Errores Detallados (oculto por defecto) -->
        <div class="errores-detalle" id="errores-detalle">
            <h3 style="color: #ef4444; margin-bottom: 15px;">⚠️ Errores Detallados</h3>
            <div id="errores-lista"></div>
        </div>
    </div>

    <script>
        let intervalo = null;
        let procesoActivo = false;

        // Función para actualizar el dashboard
        async function actualizarDashboard() {
            try {
                const response = await fetch('estado_envio.json?' + new Date().getTime());
                const data = await response.json();

                // Actualizar métricas
                document.getElementById('enviados').textContent = data.enviados;
                document.getElementById('errores').textContent = data.errores;
                document.getElementById('total').textContent = data.total;

                // Actualizar barra de progreso
                const progreso = data.progreso_porcentaje || 0;
                const progressBar = document.getElementById('progress-bar');
                progressBar.style.width = progreso + '%';
                progressBar.textContent = progreso + '%';

                // Actualizar badge de estado
                const badge = document.getElementById('estado-badge');
                badge.textContent = data.estado;
                badge.className = 'estado-badge estado-' + data.estado;

                // Último envío
                document.getElementById('ultimo-envio').textContent = 
                    '📬 Último envío: ' + (data.ultimo_envio || 'Ninguno');

                // Actualizar logs
                if (data.logs && data.logs.length > 0) {
                    const logsContainer = document.getElementById('logs-container');
                    logsContainer.innerHTML = '';

                    data.logs.reverse().forEach(log => {
                        const logItem = document.createElement('div');
                        logItem.className = 'log-item' + (log.status === 'error' ? ' error' : '');
                        logItem.innerHTML = `
                            <span class="log-status ${log.status === 'error' ? 'error' : ''}"></span>
                            <span class="log-timestamp">${log.timestamp}</span>
                            <span class="log-email">${log.email}</span>
                            <span style="font-size: 12px; color: #6b7280;">${log.nombre}</span>
                        `;
                        logsContainer.appendChild(logItem);
                    });
                }

                // Mostrar errores si existen
                if (data.errores_detalle && data.errores_detalle.length > 0) {
                    const errorSection = document.getElementById('errores-detalle');
                    const errorLista = document.getElementById('errores-lista');
                    
                    errorSection.classList.add('visible');
                    errorLista.innerHTML = '';

                    data.errores_detalle.forEach(error => {
                        const errorItem = document.createElement('div');
                        errorItem.className = 'error-item';
                        errorItem.innerHTML = `
                            <strong>${error.timestamp}</strong> - ${error.email}<br>
                            <small style="color: #991b1b;">${error.error}</small>
                        `;
                        errorLista.appendChild(errorItem);
                    });
                }

                // Si terminó, detener monitoreo
                if (data.estado === 'completado') {
                    detenerMonitoreo();
                    alert('✅ Proceso completado!\n\nEnviados: ' + data.enviados + '\nErrores: ' + data.errores);
                }

            } catch (error) {
                console.log('Esperando archivo de estado...');
            }
        }

        // Función para iniciar el envío
        async function iniciarEnvio() {
            if (procesoActivo) {
                alert('⚠️ Ya hay un proceso activo');
                return;
            }

            if (!confirm('¿Estás seguro de iniciar el envío masivo?')) {
                return;
            }

            procesoActivo = true;
            document.getElementById('btn-iniciar').disabled = true;
            document.getElementById('logs-container').innerHTML = '<div class="spinner"></div>';

            // Iniciar el monitoreo antes de llamar al script
            intervalo = setInterval(actualizarDashboard, 1000);

            // Llamar al script PHP en segundo plano
            fetch('envio_masivo.php')
                .then(response => response.json())
                .then(data => {
                    console.log('Proceso completado:', data);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('❌ Error al iniciar el proceso: ' + error);
                    detenerMonitoreo();
                });
        }

        // Función para detener el monitoreo
        function detenerMonitoreo() {
            if (intervalo) {
                clearInterval(intervalo);
                intervalo = null;
            }
            procesoActivo = false;
            document.getElementById('btn-iniciar').disabled = false;
        }

        // Función para resetear el sistema
        function resetearSistema() {
            if (!confirm('⚠️ Esto borrará el estado actual y permitirá iniciar un nuevo envío.\n\n¿Continuar?')) {
                return;
            }

            // Detener monitoreo
            detenerMonitoreo();

            // Limpiar interfaz
            document.getElementById('enviados').textContent = '0';
            document.getElementById('errores').textContent = '0';
            document.getElementById('total').textContent = '0';
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-bar').textContent = '0%';
            document.getElementById('estado-badge').textContent = 'Esperando...';
            document.getElementById('estado-badge').className = 'estado-badge estado-iniciando';
            document.getElementById('ultimo-envio').textContent = 'Esperando inicio del proceso...';
            document.getElementById('logs-container').innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 40px 0;">No hay envíos aún. Presiona "Iniciar Envío" para comenzar.</p>';
            document.getElementById('errores-detalle').classList.remove('visible');

            // Intentar borrar el archivo JSON
            fetch('estado_envio.json', { method: 'DELETE' }).catch(() => {});

            alert('✅ Sistema reseteado. Ya puedes iniciar un nuevo envío.');
        }

        // Actualizar una vez al cargar
        actualizarDashboard();
    </script>
</body>
</html>
